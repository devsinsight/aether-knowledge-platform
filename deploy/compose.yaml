# Local deployment (platform.md, "Deployment"). One file for the whole platform. From the repository root:
#   docker compose -f deploy/compose.yaml up -d qdrant sync
#   docker compose -f deploy/compose.yaml exec sync aether-pipeline sync pipelines/confluence-aether.yaml --preview
#   docker compose -f deploy/compose.yaml exec sync aether-pipeline sync pipelines/confluence-aether.yaml
#
# Each service gets only the credentials it needs, from its own git-ignored env file:
#   ../.env                 sync and pipeline: read-only Confluence account, Qdrant admin key
#   ../.env.qdrant          qdrant: admin and read-only API keys
#   ../.env.knowledge-mcp   knowledge-mcp: the Qdrant READ-ONLY key only
#   ../.env.publisher       publisher: wiki write account (Work Records only), read-only Azure Boards PAT
# Every file is optional: without keys, Qdrant runs without authentication (local only).
name: aether-knowledge
services:
  qdrant:
    # The Qdrant Web UI is bundled in this image: http://localhost:6333/dashboard
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    env_file: [{ path: ../.env.qdrant, required: false }]
    volumes: ["qdrant_storage:/qdrant/storage"]

  # The LlamaIndex pipeline as a service: internal sync API on the compose network, no host port.
  sync:
    image: aether-knowledge-platform:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [{ path: ../.env, required: false }]
    environment:
      QDRANT_URL: http://qdrant:6333
      STATE_DB: /app/state/runs.sqlite
      PYTHONUNBUFFERED: "1"
    volumes: ["../state:/app/state", "model_cache:/cache"]
    depends_on: [qdrant]
    restart: unless-stopped
    command: ["aether-pipeline", "serve", "pipelines/confluence-aether.yaml", "--port", "8081"]

  # Work records: Markdown file (by path) -> wiki page -> sync of that page. The only service with wiki
  # write access (an account limited to the Work Records tree); internal API, no host port.
  publisher:
    image: aether-knowledge-platform:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [{ path: ../.env.publisher, required: false }]
    environment:
      SYNC_URL: http://sync:8081
      WORK_RECORDS_DIR: /work-records
      STATE_DB: /app/state/runs.sqlite
      PYTHONUNBUFFERED: "1"
    volumes: ["../work-records:/work-records:ro", "../state:/app/state"]
    depends_on: [sync]
    restart: unless-stopped
    command: ["aether-pipeline", "publisher", "serve", "--port", "8090"]

  # One-off CLI runs (run, eval, state rebuild): docker compose ... run --rm pipeline <command>
  pipeline:
    image: aether-knowledge-platform:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    profiles: ["tools"]
    env_file: [{ path: ../.env, required: false }]
    environment:
      QDRANT_URL: http://qdrant:6333
      STATE_DB: /app/state/runs.sqlite
    volumes: ["../state:/app/state", "model_cache:/cache"]
    depends_on: [qdrant]
    entrypoint: ["aether-pipeline"]

  # Knowledge MCP over stdio (docker compose ... run --rm -i -T knowledge-mcp). It never writes: it holds
  # only the Qdrant read-only key, and its sync tools ask the sync service over the compose network.
  knowledge-mcp:
    image: aether-knowledge-platform:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    profiles: ["tools"]
    stdin_open: true
    env_file: [{ path: ../.env.knowledge-mcp, required: false }]
    environment:
      QDRANT_URL: http://qdrant:6333
      SYNC_URL: http://sync:8081
      PUBLISHER_URL: http://publisher:8090
    volumes: ["model_cache:/cache"]
    depends_on: [qdrant]
    entrypoint: ["aether-knowledge-mcp"]

  checks:
    image: aether-knowledge-platform:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    profiles: ["tools"]
    volumes: ["../packages:/app/packages", "../pyproject.toml:/app/pyproject.toml"]
    entrypoint: ["sh", "-c", "uv run --no-sync ruff check . && uv run --no-sync pyright && uv run --no-sync lint-imports && uv run --no-sync pytest -q"]

volumes:
  qdrant_storage:
  model_cache:
